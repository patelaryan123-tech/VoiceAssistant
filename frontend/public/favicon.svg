<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="glow-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-sm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial gradient for core -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00ffff" stop-opacity="0.95"/>
      <stop offset="40%"  stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#003366" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#041830"/>
      <stop offset="100%" stop-color="#010810"/>
    </radialGradient>

    <!-- Hex gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#004477" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Rounded rect background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <line x1="0"  y1="16" x2="64" y2="16" stroke="#00d4ff" stroke-width="0.25" stroke-opacity="0.08"/>
  <line x1="0"  y1="32" x2="64" y2="32" stroke="#00d4ff" stroke-width="0.25" stroke-opacity="0.08"/>
  <line x1="0"  y1="48" x2="64" y2="48" stroke="#00d4ff" stroke-width="0.25" stroke-opacity="0.08"/>
  <line x1="16" y1="0"  x2="16" y2="64" stroke="#00d4ff" stroke-width="0.25" stroke-opacity="0.08"/>
  <line x1="32" y1="0"  x2="32" y2="64" stroke="#00d4ff" stroke-width="0.25" stroke-opacity="0.08"/>
  <line x1="48" y1="0"  x2="48" y2="64" stroke="#00d4ff" stroke-width="0.25" stroke-opacity="0.08"/>

  <!-- Corner brackets -->
  <path d="M4 12 L4 4 L12 4"  fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9" filter="url(#glow-sm)"/>
  <path d="M52 4 L60 4 L60 12" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9" filter="url(#glow-sm)"/>
  <path d="M4 52 L4 60 L12 60" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9" filter="url(#glow-sm)"/>
  <path d="M52 60 L60 60 L60 52" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9" filter="url(#glow-sm)"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#00d4ff" stroke-width="0.6" stroke-opacity="0.2"/>

  <!-- Middle ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#00d4ff" stroke-width="0.7" stroke-opacity="0.35"/>

  <!-- Dashed orbit ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.15"
          stroke-dasharray="3 5"/>

  <!-- Hexagon fill -->
  <polygon points="32,12 47.6,21 47.6,43 32,52 16.4,43 16.4,21"
           fill="url(#hexGrad)" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.5" filter="url(#glow-sm)"/>

  <!-- Inner glow circle -->
  <circle cx="32" cy="32" r="14" fill="url(#coreGrad)" filter="url(#glow-lg)" opacity="0.7"/>

  <!-- Letter A -->
  <text x="32" y="40"
        text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="22"
        font-weight="900"
        fill="#00d4ff"
        filter="url(#glow-lg)"
        letter-spacing="-1">A</text>

  <!-- Small tick marks on hex corners -->
  <circle cx="32" cy="12" r="1.2" fill="#00d4ff" opacity="0.8" filter="url(#glow-sm)"/>
  <circle cx="47.6" cy="21" r="1.2" fill="#00d4ff" opacity="0.8" filter="url(#glow-sm)"/>
  <circle cx="47.6" cy="43" r="1.2" fill="#00d4ff" opacity="0.8" filter="url(#glow-sm)"/>
  <circle cx="32" cy="52" r="1.2" fill="#00d4ff" opacity="0.8" filter="url(#glow-sm)"/>
  <circle cx="16.4" cy="43" r="1.2" fill="#00d4ff" opacity="0.8" filter="url(#glow-sm)"/>
  <circle cx="16.4" cy="21" r="1.2" fill="#00d4ff" opacity="0.8" filter="url(#glow-sm)"/>
</svg>